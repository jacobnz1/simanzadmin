<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMA Admin V31 (Alerts Fixed)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f3f4f6; --panel: #ffffff; --text: #1f2937; --primary: #2563eb; --border: #e5e7eb; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        #app { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; height: 90vh; }
        .sidebar { width: 250px; background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; overflow-y: auto; }
        .brand { font-weight: 800; font-size: 1.2rem; margin-bottom: 20px; color: #111827; }
        .nav-btn { text-align: left; background: none; border: none; padding: 12px; border-radius: 8px; font-weight: 600; color: #4b5563; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: #eff6ff; color: var(--primary); }
        .nav-btn.active { background: var(--primary); color: white; }
        .main { flex: 1; background: var(--panel); border-radius: 12px; border: 1px solid var(--border); padding: 30px; overflow-y: auto; }
        .tab { display: none; } .tab.active { display: block; }
        .card { border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; margin-bottom: 15px; box-sizing: border-box; }
        button { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; color: white; }
        .btn-primary { background: var(--primary); width: 100%; }
        .btn-secondary { background: #f3f4f6; color: #1f2937; }
        .btn-danger { background: #ef4444; padding: 5px 10px; font-size: 0.8rem; }
        .btn-success { background: #10b981; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; }
        #toast { position: fixed; bottom: 30px; right: 30px; background: #1f2937; color: white; padding: 12px 24px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div id="app">
    <div class="sidebar">
        <div class="brand">SIMA Admin</div>
        <!-- UPDATED NAV: Removed News & Towns -->
        <button class="nav-btn active" onclick="setTab('alerts')">Alerts</button>
        <button class="nav-btn" onclick="setTab('storm')">StormCast</button>
        <button class="nav-btn" onclick="setTab('snow')">SnowCast</button>
        <button class="nav-btn" onclick="setTab('sig')">Sig. Weather</button>
        <button class="nav-btn" onclick="setTab('drought')">DroughtCast</button>
        <button class="nav-btn" onclick="setTab('archive')" style="margin-top:auto; background:#374151;">Archives</button>
    </div>

    <div class="main">

        <!-- ALERTS TAB -->
        <div id="tab-alerts" class="tab active">
            <h1>Weather Alerts</h1>
            <div class="card">
                <label>Bulletin Title</label><input id="ag-title" placeholder="e.g. Severe Weather Warning">
                <label>Overview</label><textarea id="ag-over" rows="2" placeholder="General overview..."></textarea>
            </div>
            <div class="card">
                <h3>Add Alert Block</h3>
                <div class="grid-2">
                    <div><label>Risk Level</label><select id="ag-risk"><option value="Critical">CRITICAL (Purple)</option><option value="High">HIGH (Red)</option><option value="Enhanced">ENHANCED (Orange)</option><option value="Slight">SLIGHT (Yellow)</option><option value="Special">SPECIAL (Blue)</option></select></div>
                    <div><label>Hazard</label><select id="ag-haz"><option>Heavy Rain</option><option>Severe Gales</option><option>Heavy Snow</option><option>Thunderstorms</option><option>Low Snow</option></select></div>
                </div>
                <label>Regions</label><input id="ag-reg" placeholder="e.g. Fiordland, Westland">
                <div class="grid-2">
                    <div><label>Start</label><input type="datetime-local" id="ag-start"></div>
                    <div><label>End</label><input type="datetime-local" id="ag-end"></div>
                </div>
                <label>Details</label><textarea id="ag-det" rows="3"></textarea>
                <button class="btn-secondary" onclick="stageAlert()" style="width:100%">+ Add Block</button>
            </div>
            <div class="card">
                <h3>Staged Alerts</h3>
                <div id="ag-list"></div>
            </div>
            <button class="btn-primary" onclick="saveAlerts()">Publish Alerts</button>
        </div>

        <!-- STORMCAST TAB -->
        <div id="tab-storm" class="tab">
            <h1>StormCast</h1>
            <div class="card" style="background:#f0fdf4; border-color:#16a34a;">
                <h3>Create New Outlook Period</h3>
                <label>Title</label><input id="stc-title" placeholder="e.g. Today's Outlook">
                <div class="grid-2">
                    <div><label>Valid From</label><input type="datetime-local" id="stc-start"></div>
                    <div><label>Valid To</label><input type="datetime-local" id="stc-end"></div>
                </div>
                <label>Overview</label><textarea id="stc-over" rows="3"></textarea>
                <label>Map Image</label><input type="file" id="stc-img">
                
                <hr style="margin:20px 0; border:0; border-top:1px solid #ddd;">
                
                <label><strong>Regional Details (Add multiple if needed)</strong></label>
                <div id="stc-regions"></div>
                <button class="btn-secondary" onclick="addStcRegionUI()" style="margin-bottom:15px;">+ Add Region Detail</button>

                <button class="btn-success" onclick="addStormCast()" style="width:100%;">Add Outlook to List</button>
            </div>
            
            <div class="card">
                <h3>Active Outlooks (Sorted by Expiry)</h3>
                <div id="stc-list"></div>
            </div>
            <button class="btn-primary" onclick="saveStorm()">Publish StormCast</button>
        </div>

        <!-- SNOWCAST TAB -->
        <div id="tab-snow" class="tab">
            <h1>SnowCast</h1>
            <div class="card"><label>Main Title</label><input id="sc-title"><label>Overview</label><textarea id="sc-over" rows="2"></textarea></div>
            <div class="card">
                <h3>Add Region</h3>
                <div class="grid-2"><div><label>Region</label><input id="sc-reg-name"></div><div><label>Risk</label><select id="sc-reg-risk"><option>Slight</option><option>High</option></select></div></div>
                <div class="grid-2"><div><label>From</label><input type="datetime-local" id="sc-start"></div><div><label>To</label><input type="datetime-local" id="sc-end"></div></div>
                <label>Details</label><textarea id="sc-reg-sum"></textarea>
                <button onclick="addSnowRegion()" class="btn-success" style="width:100%">Add Region</button>
            </div>
            <div id="sc-regions-list" class="card"></div>
            <button class="btn-primary" onclick="saveSnow()">Publish SnowCast</button>
        </div>

        <!-- SIG WEATHER -->
        <div id="tab-sig" class="tab">
            <h1>Significant Weather Outlook</h1>
            <div class="card"><label>Bulletin Title</label><input id="sig-title"><label>Summary</label><textarea id="sig-sum" rows="2"></textarea></div>
            <div class="card">
                <h3>Add Day</h3>
                <div class="grid-2"><div><label>Date</label><input type="date" id="swo-date"></div><div><label>Risk</label><select id="swo-risk"><option>Slight</option><option>Enhanced</option><option>High</option><option>Critical</option></select></div></div>
                <label>Details</label><textarea id="swo-summary"></textarea><label>Image</label><input type="file" id="swo-img">
                <button onclick="addSigDay()" class="btn-success" style="width:100%">Add Day</button>
            </div>
            <div id="swo-entries-container" class="card"></div>
            <button class="btn-primary" onclick="saveSigWeather()">Publish Outlook</button>
        </div>

        <!-- DROUGHT -->
        <div id="tab-drought" class="tab">
            <h1>DroughtCast</h1>
            <div class="card"><label>Title</label><input id="dc-title"><label>Summary</label><textarea id="dc-sum" rows="2"></textarea></div>
            <div class="card">
                <h3>Add Alert</h3>
                <div class="grid-2"><div><label>Region</label><input id="dc-reg"></div><div><label>Severity</label><select id="dc-sev"><option>Low</option><option>High</option></select></div></div>
                <div class="grid-2"><div><label>Rain Potential</label><input id="dc-rain"></div><div><label>Expires</label><input type="date" id="dc-end"></div></div>
                <label>Details</label><textarea id="dc-det"></textarea>
                <button onclick="addDroughtAlert()" class="btn-success" style="width:100%">Add Alert</button>
            </div>
            <div id="dc-list" class="card"></div>
            <button class="btn-primary" onclick="saveDrought()">Publish DroughtCast</button>
        </div>

        <!-- ARCHIVE -->
        <div id="tab-archive" class="tab">
            <h1>Archives</h1>
            <select id="arch-sel" onchange="loadArch()" style="margin-bottom:15px; padding:10px;"><option value="alerts">Alerts</option><option value="storm">StormCast</option><option value="snow">SnowCast</option><option value="sig">Sig Weather</option></select>
            <div id="arch-view" class="card">Select source...</div>
        </div>

    </div>
</div>
<div id="toast">Saved!</div>

<script>
const KEY = '$2a$10$/h3xvps5BAmoU8dJigw8T.qYg3eoESVLwjXbX9aHmb85Y96cExsCe';
const IMG_KEY = '11bca15e224ed683c68e78cc0013c205';
const BINS = { alerts:'68db095dae596e708f0072be', storm:'68d8cdac43b1c97be9528f9b', snow:'68e0738e43b1c97be9599eb1', sig:'68d8c3c6d0ea881f408d7a5c', drought:'68d9fc07d0ea881f408e8e5b' };
const api = (b) => `https://api.jsonbin.io/v3/b/${BINS[b]}`;
const headers = {'X-Master-Key': KEY, 'Content-Type': 'application/json'};
const getFresh = (u) => u + '?t=' + Date.now();

// STATE
let data = { alerts:[], storm:[], snow:[], sig:[], drought:[] };
let archives = { alerts:[], storm:[], snow:[], sig:[], drought:[] };

function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }
function setTab(id) { document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active'); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); }
async function upImg(el) { if(!el.files[0]) return null; const fd = new FormData(); fd.append('image', el.files[0]); const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_KEY}`, {method:'POST', body:fd}); const j = await r.json(); return j.data.url; }

// --- LOADERS ---
async function init() {
    // ALERTS
    fetch(getFresh(api('alerts')+'/latest'), {headers:{'X-Master-Key':KEY}}).then(r=>r.json()).then(d => {
        data.alerts = d.record.blocks || [];
        archives.alerts = d.record.archive || [];
        document.getElementById('ag-title').value = d.record.globalInfo?.title||'';
        document.getElementById('ag-over').value = d.record.globalInfo?.overview||'';
        renderAlerts();
    });

    // STORMCAST
    fetch(getFresh(api('storm')+'/latest'), {headers:{'X-Master-Key':KEY}}).then(r=>r.json()).then(d => {
        data.storm = d.record.outlooks || [];
        archives.storm = d.record.archive || [];
        renderStormList();
    });

    // SNOWCAST
    fetch(getFresh(api('snow')+'/latest'), {headers:{'X-Master-Key':KEY}}).then(r=>r.json()).then(d => {
        data.snow = d.record.forecasts || [];
        archives.snow = d.record.archive || [];
        document.getElementById('sc-title').value = d.record.mainTitle||'';
        document.getElementById('sc-over').value = d.record.overview||'';
        renderSnowList();
    });

    // SIG WEATHER
    fetch(getFresh(api('sig')+'/latest'), {headers:{'X-Master-Key':KEY}}).then(r=>r.json()).then(d => {
        data.sig = d.record.forecasts || [];
        archives.sig = d.record.archive || [];
        document.getElementById('swo-overallTitle').value = d.record.overallTitle||'';
        document.getElementById('swo-overallSummary').value = d.record.overallSummary||'';
        renderSigList();
    });

    // DROUGHT
    fetch(getFresh(api('drought')+'/latest'), {headers:{'X-Master-Key':KEY}}).then(r=>r.json()).then(d => {
        data.drought = d.record.alerts || [];
        document.getElementById('dc-title').value = d.record.overview?.title||'';
        document.getElementById('dc-sum').value = d.record.overview?.summary||'';
        renderDroughtList();
    });
}

// --- ALERTS LOGIC (FIXED) ---
function renderAlerts() {
    const c = document.getElementById('ag-list'); c.innerHTML = '';
    data.alerts.forEach((a,i) => {
        c.innerHTML += `<div class="item-list-row"><div><strong>${a.weatherType} (${a.type})</strong><br><small>${a.regions}</small></div><button class="btn-danger btn-sm" onclick="data.alerts.splice(${i},1); renderAlerts();">Delete</button></div>`;
    });
}
function stageAlert() {
    // Correctly fetching values now
    data.alerts.push({
        type: document.getElementById('ag-risk').value, // Fixed ID
        weatherType: document.getElementById('ag-haz').value, // Fixed ID
        regions: document.getElementById('ag-reg').value.split(','),
        startTime: document.getElementById('ag-start').value,
        endTime: document.getElementById('ag-end').value,
        summary: document.getElementById('ag-det').value
    });
    renderAlerts();
    // Clear inputs for next
    document.getElementById('ag-reg').value = '';
    document.getElementById('ag-det').value = '';
}
async function saveAlerts() {
    toast('Saving...');
    await fetch(api('alerts'), {method:'PUT', headers, body:JSON.stringify({
        globalInfo: { title: document.getElementById('ag-title').value, overview: document.getElementById('ag-over').value },
        blocks: data.alerts,
        archive: archives.alerts
    })});
    toast('Published!');
}

// --- STORMCAST LOGIC (FIXED MULTI-PERIOD) ---
function addStcRegionUI() {
    const d = document.createElement('div'); d.className='sub-item'; d.innerHTML=`<label>Region Name</label><input class="r-name"><label>Risk</label><select class="r-lvl"><option>Slight</option><option>High</option></select><label>Details</label><textarea class="r-det"></textarea><button class="btn-danger btn-sm" onclick="this.parentElement.remove()">Remove</button>`;
    document.getElementById('stc-regions').appendChild(d);
}
async function addStormCast() {
    toast('Uploading Map...');
    const img = await upImg(document.getElementById('stc-img'));
    const regs = Array.from(document.getElementById('stc-regions').children).map(e => ({
        regionName: e.querySelector('.r-name').value,
        riskLevel: e.querySelector('.r-lvl').value,
        threats: e.querySelector('.r-det').value,
        risks: ["General"]
    }));
    
    const fc = {
        title: document.getElementById('stc-title').value,
        validFrom: document.getElementById('stc-start').value,
        validUntil: document.getElementById('stc-end').value,
        overallDiscussion: document.getElementById('stc-over').value,
        mapUrl: img,
        regionalForecasts: regs
    };
    
    // Add to array
    data.storm.push(fc);
    
    // SORT: Earliest expiry first
    data.storm.sort((a,b) => new Date(a.validUntil) - new Date(b.validUntil));
    
    renderStormList();
    toast('Added! Click Publish to save.');
    
    // Reset form
    document.getElementById('stc-title').value = '';
    document.getElementById('stc-over').value = '';
    document.getElementById('stc-regions').innerHTML = '';
}
function renderStormList() {
    const c = document.getElementById('stc-list'); c.innerHTML='';
    data.storm.forEach((o,i) => {
        c.innerHTML += `<div class="item-list-row"><div><strong>${o.title}</strong><br><small>Expires: ${new Date(o.validUntil).toLocaleString()}</small></div><button class="btn-danger btn-sm" onclick="data.storm.splice(${i},1);renderStormList()">Delete</button></div>`;
    });
}
async function saveStorm() {
    await fetch(api('storm'), {method:'PUT', headers, body:JSON.stringify({outlooks:data.storm, archive:archives.storm})});
    toast('Published!');
}

// --- SNOWCAST ---
function addSnowRegion() {
    data.snow.push({
        region: document.getElementById('sc-reg-name').value,
        riskLevel: document.getElementById('sc-reg-risk').value,
        validFrom: document.getElementById('sc-start').value,
        validTo: document.getElementById('sc-end').value,
        summary: document.getElementById('sc-reg-sum').value
    });
    renderSnowList();
}
function renderSnowList() {
    const c = document.getElementById('sc-regions-list'); c.innerHTML='';
    data.snow.forEach((f,i) => { c.innerHTML+=`<div class="item-list-row"><div>${f.region} (${f.riskLevel})</div><button class="btn-danger btn-sm" onclick="data.snow.splice(${i},1);renderSnowList()">Del</button></div>`; });
}
async function saveSnow() {
    await fetch(api('snow'), {method:'PUT', headers, body:JSON.stringify({mainTitle:document.getElementById('sc-title').value, overview:document.getElementById('sc-over').value, forecasts:data.snow, archive:archives.snow})});
    toast('Published!');
}

// --- SIG WEATHER ---
async function addSigDay() {
    toast('Uploading...');
    const img = await upImg(document.getElementById('swo-img'));
    data.sig.push({
        date: document.getElementById('swo-date').value,
        alertLevel: document.getElementById('swo-risk').value,
        summary: document.getElementById('swo-summary').value,
        imageUrl: img
    });
    renderSigList();
    toast('Added!');
}
function renderSigList() {
    const c = document.getElementById('swo-entries-container'); c.innerHTML='';
    data.sig.forEach((f,i) => { c.innerHTML+=`<div class="item-list-row"><div>${f.date} (${f.alertLevel})</div><button class="btn-danger btn-sm" onclick="data.sig.splice(${i},1);renderSigList()">Del</button></div>`; });
}
async function saveSigWeather() {
    await fetch(api('sig'), {method:'PUT', headers, body:JSON.stringify({overallTitle:document.getElementById('swo-overallTitle').value, overallSummary:document.getElementById('swo-overallSummary').value, forecasts:data.sig, archive:archives.sig})});
    toast('Published!');
}

// --- DROUGHT ---
function addDroughtAlert() {
    data.drought.push({
        region: document.getElementById('dc-reg').value,
        severity: document.getElementById('dc-sev').value,
        rainPotential: document.getElementById('dc-rain').value,
        endDate: document.getElementById('dc-end').value,
        summary: document.getElementById('dc-det').value
    });
    renderDroughtList();
}
function renderDroughtList() {
    const c = document.getElementById('dc-list'); c.innerHTML='';
    data.drought.forEach((a,i) => { c.innerHTML+=`<div class="item-list-row"><div>${a.region}</div><button class="btn-danger btn-sm" onclick="data.drought.splice(${i},1);renderDroughtList()">Del</button></div>`; });
}
async function saveDrought() {
    await fetch(api('drought'), {method:'PUT', headers, body:JSON.stringify({overview:{title:document.getElementById('dc-title').value, summary:document.getElementById('dc-sum').value}, alerts:data.drought})});
    toast('Published!');
}

// --- ARCHIVE ---
async function loadArch() {
    const k = document.getElementById('arch-sel').value;
    const c = document.getElementById('arch-view'); c.innerHTML = 'Fetching...';
    fetch(api(k)+'/latest?t='+Date.now(), {headers:{'X-Master-Key':KEY}}).then(r=>r.json()).then(d=>{
        const arch = d.record.archive || [];
        c.innerHTML = arch.length ? arch.map(i=>`<div class="item-list-row" style="background:white;">${i.title||i.weatherType||'Item'}</div>`).join('') : 'No archives.';
    });
}

init();
</script>
</body>
</html>
