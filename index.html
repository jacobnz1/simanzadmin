<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDV7t0Cv4_triZN_E3j3CjFjmBdqEZlBas",
      authDomain: "simaadmin.firebaseapp.com",
      databaseURL: "https://simaadmin-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "simaadmin",
      storageBucket: "simaadmin.firebasestorage.app",
      messagingSenderId: "699189902374",
      appId: "1:699189902374:web:c1415680b0da63041b7ae7",
      measurementId: "G-QK6WCKLX47"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Firebase Save Logic
    window.saveDataToFirebase = async function(dataObject) {
        try {
            await setDoc(doc(db, "admin_data", "settings"), dataObject);
            if (typeof showToast === "function") showToast("Successfully saved to Firebase!");
            console.log("Firebase save successful.");
        } catch (error) {
            console.error("Firebase Save Error:", error);
            if (typeof showToast === "function") showToast("Error saving to Firebase! Check console.");
        }
    };

    // 2. Firebase Auto-Load Logic
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const docSnap = await getDoc(doc(db, "admin_data", "settings"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // IMPORTANT: Send the loaded data to your existing UI population function.
                // Replace 'window.populateUI(data)' with whatever function you currently use 
                // in index (33).html to render the tables after JSONBIN loads.
                if (typeof window.populateUI === "function") {
                    window.populateUI(data);
                } else {
                    console.warn("Please link your UI render function here.");
                }
                
                if (typeof showToast === "function") showToast("Data loaded from Firebase!");
            } else {
                console.log("No existing settings document found in Firebase.");
            }
        } catch (error) {
            console.error("Firebase Load Error:", error);
        }
    });
</script>
