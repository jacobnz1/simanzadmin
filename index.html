<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMA Admin V39 (Mobile Responsive)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
      const firebaseConfig = {
        apiKey: "AIzaSyDV7t0Cv4_triZN_E3j3CjFjmBdqEZlBas",
        authDomain: "simaadmin.firebaseapp.com",
        databaseURL: "https://simaadmin-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "simaadmin",
        storageBucket: "simaadmin.firebasestorage.app",
        messagingSenderId: "699189902374",
        appId: "1:699189902374:web:c1415680b0da63041b7ae7",
        measurementId: "G-QK6WCKLX47"
      };
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
    </script>
    <style>
        :root { 
            --bg-app: #f3f4f6; 
            --bg-panel: #ffffff; 
            --text-main: #111827; 
            --text-muted: #6b7280; 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8;
            --border: #e5e7eb; 
            --danger: #ef4444; 
            --success: #10b981; 
            --warning: #f59e0b; 
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body { margin: 0; padding: 0; background-color: #d1d5db; font-family: 'Inter', sans-serif; color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        #sima-admin-wrapper { display: flex; width: 96%; height: 95vh; background-color: var(--bg-app); border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); max-width: 1800px; }
        
        .sidebar { width: 260px; background-color: var(--bg-panel); display: flex; flex-direction: column; padding: 1.5rem; border-right: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
        .brand { font-size: 1.5rem; font-weight: 800; margin-bottom: 2.5rem; color: var(--primary); letter-spacing: -0.5px; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 14px 16px; text-align: left; width: 100%; cursor: pointer; border-radius: var(--radius); font-weight: 600; margin-bottom: 8px; transition: all 0.2s ease; font-size: 0.95rem; }
        .nav-btn:hover { background-color: #f3f4f6; color: var(--primary); transform: translateX(4px); }
        .nav-btn.active { background-color: var(--primary); color: white; transform: translateX(4px); box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }

        .main-content { flex-grow: 1; overflow-y: auto; padding: 2.5rem; position: relative; scroll-behavior: smooth; }
        h1 { font-size: 1.8rem; margin-top: 0; margin-bottom: 1.5rem; font-weight: 800; color: #111827; letter-spacing: -0.5px; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
        h2 { font-size: 1.4rem; margin-top: 2rem; margin-bottom: 1rem; color: #374151; font-weight: 700; }
        
        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: #374151; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: var(--radius); font-size: 0.95rem; font-family: 'Inter', sans-serif;}
        input[type="file"] { padding: 8px; }
        
        button { cursor: pointer; font-weight: 600; border: none; border-radius: var(--radius); padding: 12px 24px; transition: all 0.2s; color: white; margin-top: 10px; }
        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-remove { background: #fee2e2; color: #ef4444; padding: 8px 16px; margin-top: 0; }
        
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

        .image-preview { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin-top: 10px; border: 1px dashed var(--border); display: none; }
        .image-preview.visible { display: block; }

        #tab-swsgen .output-box { background: #1e1e1e; color: #d4d4d4; font-family: monospace; padding: 25px; border-radius: 10px; white-space: pre-wrap; height: 100%; min-height: 480px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 15px 30px; border-radius: 8px; font-weight: 600; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 9999; }

        @media (max-width: 900px) {
            #sima-admin-wrapper { flex-direction: column; height: 100vh; width: 100%; }
            .sidebar { width: 100%; flex-direction: row; overflow-x: auto; height: auto; }
            .brand { display: none; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="sima-admin-wrapper">
        <div class="sidebar">
            <div class="brand">SIMA Admin V39</div>
            <button class="nav-btn active" onclick="setTab('alerts')">Alerts</button>
            <button class="nav-btn" onclick="setTab('storm')">StormCast</button>
            <button class="nav-btn" onclick="setTab('snow')">SnowCast</button>
            <button class="nav-btn" onclick="setTab('sigweather')">Sig. Weather</button>
            <button class="nav-btn" onclick="setTab('drought')">DroughtCast</button>
            <button class="nav-btn" onclick="setTab('swsgen')">SWS Generator</button>
            
            <div style="margin-top: auto;">
                <button class="btn-primary" style="width: 100%;" onclick="saveAllData()">💾 Push to Firebase</button>
            </div>
        </div>

        <div class="main-content">
            <div id="tab-alerts" class="tab-pane active">
                <h1>Severe Weather Alerts</h1>
                <div class="card">
                    <div class="form-group">
                        <label>Global Overview</label>
                        <textarea id="alert-global-overview" placeholder="General situation for the South Island..."></textarea>
                    </div>
                </div>
                <div id="alerts-list"></div>
                <button class="btn-success" onclick="addAlertBlock()">+ Add Warning/Watch</button>
            </div>

            <div id="tab-storm" class="tab-pane">
                <h1>StormCast Management</h1>
                <div class="card">
                    <div class="form-group"><label>Title</label><input type="text" id="storm-title"></div>
                    <div class="form-group"><label>Discussion</label><textarea id="storm-discussion"></textarea></div>
                    <div class="grid-2">
                        <div class="form-group"><label>Valid From</label><input type="datetime-local" id="storm-from"></div>
                        <div class="form-group"><label>Valid Until</label><input type="datetime-local" id="storm-until"></div>
                    </div>
                </div>
                <div id="storm-regions"></div>
                <button class="btn-success" onclick="addStormRegion()">+ Add Region</button>
            </div>

            <div id="tab-snow" class="tab-pane">
                <h1>SnowCast Management</h1>
                <div class="card">
                    <div class="form-group"><label>Main Title</label><input type="text" id="snow-title" value="SnowCast"></div>
                    <div class="form-group"><label>Overview</label><textarea id="snow-overview"></textarea></div>
                    <div class="form-group">
                        <label>Snow Map Image Upload</label>
                        <input type="file" id="snow-map-file" accept="image/*" onchange="handleImageUpload(this, 'snow-map-url', 'snow-map-preview')">
                        <input type="hidden" id="snow-map-url">
                        <img id="snow-map-preview" class="image-preview">
                    </div>
                </div>
                <div id="snow-forecasts"></div>
                <button class="btn-success" onclick="addSnowForecast()">+ Add Snow Area</button>
            </div>

            <div id="tab-sigweather" class="tab-pane">
                <h1>Significant Weather Outlook</h1>
                <div class="card">
                    <div class="form-group"><label>Overall Title</label><input type="text" id="sig-title" value="Significant Weather Outlook"></div>
                    <div class="form-group"><label>Overall Summary</label><textarea id="sig-summary"></textarea></div>
                </div>
                <div id="sig-forecasts"></div>
                <button class="btn-success" onclick="addSigDay()">+ Add Outlook Day</button>
            </div>

            <div id="tab-drought" class="tab-pane">
                <h1>DroughtCast</h1>
                <div class="card">
                    <div class="form-group"><label>Title</label><input type="text" id="drought-title" value="DroughtCast"></div>
                    <div class="form-group"><label>Summary</label><textarea id="drought-summary"></textarea></div>
                </div>
                <div id="drought-list"></div>
                <button class="btn-success" onclick="addDroughtAlert()">+ Add Drought Area</button>
            </div>

            <div id="tab-swsgen" class="tab-pane">
                <h1>SWS Statement Generator</h1>
                <div class="grid-2">
                    <div class="sws-panel card">
                        <div class="form-group"><label>Event Type (e.g. Heavy Rain)</label><input type="text" id="sws-type" value="Heavy Rain"></div>
                        <div class="form-group"><label>Severity</label>
                            <select id="sws-sev">
                                <option value="Low">Low</option>
                                <option value="Moderate">Moderate</option>
                                <option value="Significant">Significant</option>
                                <option value="Extreme">Extreme</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Regions Affected</label><input type="text" id="sws-regions" value="Canterbury, Otago"></div>
                        <button class="btn-primary" onclick="generateSWS()">Generate Statement</button>
                    </div>
                    <div class="output-box" id="sws-output">Generated output will appear here...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">✅ Data Successfully Pushed to Firebase!</div>

    <script>
        const FB_DB_URL = "https://simaadmin-default-rtdb.asia-southeast1.firebasedatabase.app";
        let currentData = { alerts: {}, storm: {}, snow: {}, sig: {}, drought: {} };

        // Tab Switching
        function setTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Image to Base64 Encoder
        function handleImageUpload(input, hiddenId, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Str = e.target.result;
                    document.getElementById(hiddenId).value = base64Str;
                    const preview = document.getElementById(previewId);
                    preview.src = base64Str;
                    preview.classList.add('visible');
                };
                reader.readAsDataURL(file);
            }
        }

        // SWS Generator Logic
        function generateSWS() {
            const type = document.getElementById('sws-type').value;
            const sev = document.getElementById('sws-sev').value;
            const regions = document.getElementById('sws-regions').value;
            const output = [];
            
            output.push("=======================================================");
            output.push(`SPECIAL WEATHER STATEMENT: ${type.toUpperCase()}`);
            output.push(`SEVERITY: ${sev.toUpperCase()}`);
            output.push(`AFFECTING: ${regions.toUpperCase()}`);
            output.push("=======================================================\n");
            output.push(`A ${sev.toLowerCase()} risk of ${type.toLowerCase()} is expected for ${regions}.`);
            output.push("\nFORECAST UNCERTAINTY:\nThere remains some uncertainty regarding the exact track of this system, which may influence peak intensity and exact timing.");
            output.push("\n-------------------------------------------------------");
            output.push("\nDISCLAIMER: MetService is New Zealand's only national \nweather authority. We provide this statement purely as \na second opinion on approaching impactful weather for \nthe South Island.");
            output.push("=======================================================");
            
            document.getElementById('sws-output').textContent = output.join('\n');
        }

        // Add Empty Blocks for dynamic arrays
        function addAlertBlock() {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="grid-2">
                    <div class="form-group"><label>Type</label><input type="text" class="a-type" placeholder="e.g. Orange Warning"></div>
                    <div class="form-group"><label>Weather Type</label><input type="text" class="a-weather" placeholder="e.g. Heavy Rain"></div>
                    <div class="form-group"><label>Regions</label><input type="text" class="a-regions"></div>
                    <div class="form-group"><label>End Time</label><input type="datetime-local" class="a-end"></div>
                </div>
                <div class="form-group"><label>Summary</label><textarea class="a-summary"></textarea></div>
                <button class="btn-remove" onclick="this.parentElement.remove()">Remove Alert</button>
            `;
            document.getElementById('alerts-list').appendChild(div);
        }

        function addSnowForecast() {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="grid-2">
                    <div class="form-group"><label>Region</label><input type="text" class="sn-region"></div>
                    <div class="form-group"><label>Risk Level</label>
                        <select class="sn-risk"><option>Low</option><option>Moderate</option><option>High</option></select>
                    </div>
                </div>
                <div class="form-group"><label>Summary</label><textarea class="sn-summary"></textarea></div>
                <button class="btn-remove" onclick="this.parentElement.remove()">Remove Area</button>
            `;
            document.getElementById('snow-forecasts').appendChild(div);
        }

        // Firebase Sync
        async function loadData() {
            try {
                const r = await fetch(`${FB_DB_URL}/sima.json`);
                const json = await r.json();
                if (json) {
                    currentData = json;
                    // Populate root fields
                    if (currentData.alerts?.globalInfo) document.getElementById('alert-global-overview').value = currentData.alerts.globalInfo.overview || "";
                    if (currentData.snow) {
                        document.getElementById('snow-title').value = currentData.snow.mainTitle || "SnowCast";
                        document.getElementById('snow-overview').value = currentData.snow.overview || "";
                        if (currentData.snow.mapUrl) {
                            document.getElementById('snow-map-url').value = currentData.snow.mapUrl;
                            const preview = document.getElementById('snow-map-preview');
                            preview.src = currentData.snow.mapUrl;
                            preview.classList.add('visible');
                        }
                    }
                }
            } catch (e) { console.error("Firebase Load Error:", e); }
        }

        async function saveAllData() {
            // Rebuild Payload from DOM
            const payload = {
                alerts: { globalInfo: { overview: document.getElementById('alert-global-overview').value }, blocks: [] },
                storm: { outlooks: [] },
                snow: { 
                    mainTitle: document.getElementById('snow-title').value,
                    overview: document.getElementById('snow-overview').value,
                    mapUrl: document.getElementById('snow-map-url').value, // Preserves the base64 image data
                    forecasts: [] 
                },
                sig: { forecasts: [] },
                drought: { alerts: [] }
            };

            // Save to Firebase
            try {
                await fetch(`${FB_DB_URL}/sima.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const t = document.getElementById('toast');
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 3000);
            } catch (e) { alert("Save failed. Check console."); console.error(e); }
        }

        window.onload = loadData;
    </script>
</body>
</html>
